<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Interview - SmartHire AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">SmartHire AI</div>
    <nav>
      <a href="/">Home</a>
      <a href="#about">About Us</a>
      <a href="#contact">Contact</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>
  <section class="form-section">
    <h2>Schedule Interview</h2>
    <form>
      <label for="candidate">Candidate Name:</label>
      <input type="text" id="candidate" name="candidate" placeholder="Enter candidate name" required>
      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required>
      <label for="time">Time:</label>
      <input type="time" id="time" name="time" required>
      <label for="position">Position:</label>
      <input type="text" id="position" name="position" placeholder="Enter position" required>
      <button type="submit" class="btn">Schedule</button>
    </form>
  </section>
  <footer>
    <p>&copy; 2024 SmartHire AI. All rights reserved.</p>
  </footer>
</body>
</html>
