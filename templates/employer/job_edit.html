{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mx-auto max-w-2xl py-8">
    <h2 class="text-2xl font-bold mb-6">Edit Job</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block font-medium mb-1">Position Title</label>
            <input type="text" name="job_details[position_title]" class="w-full border rounded px-3 py-2" value="{{ job.job_details.position_title }}" required>
        </div>
        <div class="mb-4">
            <label class="block font-medium mb-1">Job Description</label>
            <textarea name="job_details[job_description]" class="w-full border rounded px-3 py-2" required>{{ job.job_details.job_description }}</textarea>
        </div>
        <div class="mb-4">
            <label class="block font-medium mb-1">Job Type</label>
            <input type="text" name="job_type[type]" class="w-full border rounded px-3 py-2" value="{{ job.job_type.type }}" required>
        </div>
        <div class="mb-4">
            <label class="block font-medium mb-1">Work Arrangement</label>
            <input type="text" name="job_type[work_arrangement]" class="w-full border rounded px-3 py-2" value="{{ job.job_type.work_arrangement }}" required>
        </div>
        <div class="mb-4">
            <label class="block font-medium mb-1">Min Salary</label>
            <input type="number" name="compensation[min_salary]" class="w-full border rounded px-3 py-2" value="{{ job.compensation.min_salary }}" required>
        </div>
        <div class="mb-4">
            <label class="block font-medium mb-1">Max Salary</label>
            <input type="number" name="compensation[max_salary]" class="w-full border rounded px-3 py-2" value="{{ job.compensation.max_salary }}" required>
        </div>
        <div class="mb-4">
            <label class="block font-medium mb-1">Location</label>
            <input type="text" name="compensation[location]" class="w-full border rounded px-3 py-2" value="{{ job.compensation.location }}">
        </div>
        <div class="mb-4">
            <label class="block font-medium mb-1">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="active" {% if job.status != 'closed' %}selected{% endif %}>Active</option>
                <option value="closed" {% if job.status == 'closed' %}selected{% endif %}>Closed</option>
            </select>
        </div>
        <div class="flex space-x-3">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Changes</button>
            <a href="{% url 'hr_dashboard' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
