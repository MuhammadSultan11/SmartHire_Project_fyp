<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Interview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/favicon.ico">
    <style>
        body { background: #f8f9fa; }
        .centered { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .form-box { background: #fff; padding: 2rem; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .ai-logo { font-size: 2rem; color: #0d6efd; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container centered">
        <div class="form-box">
            <div class="ai-logo">🤖</div>
            <h2 class="mb-3">Start Your Interview</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="candidate_name" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="candidate_name" name="candidate_name" required>
                </div>
                <div class="mb-3">
                    <label for="job_id" class="form-label">Select Job Role</label>
                    <select class="form-select" id="job_id" name="job_id" onchange="toggleNewJobFields()">
                        <option value="">-- Select an existing job role --</option>
                        {% for job in job_descriptions %}
                        <option value="{{ job.id }}">{{ job.job_role }} - {{ job.description|truncatechars:40 }}</option>
                        {% endfor %}
                        <option value="new">Add a new job role...</option>
                    </select>
                </div>
                <div id="new-job-fields" style="display:none;">
                    <div class="mb-3">
                        <label for="new_job_role" class="form-label">New Job Role</label>
                        <input type="text" class="form-control" id="new_job_role" name="new_job_role">
                    </div>
                    <div class="mb-3">
                        <label for="new_job_desc" class="form-label">Job Description</label>
                        <textarea class="form-control" id="new_job_desc" name="new_job_desc" rows="3"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Start Interview</button>
            </form>
        </div>
    </div>
    <script>
        function toggleNewJobFields() {
            var jobSelect = document.getElementById('job_id');
            var newJobFields = document.getElementById('new-job-fields');
            if (jobSelect.value === 'new') {
                newJobFields.style.display = 'block';
                document.getElementById('new_job_role').required = true;
                document.getElementById('new_job_desc').required = true;
            } else {
                newJobFields.style.display = 'none';
                document.getElementById('new_job_role').required = false;
                document.getElementById('new_job_desc').required = false;
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
